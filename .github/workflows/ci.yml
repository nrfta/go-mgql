name: CI

on:
  push:
    branches:
      - main
      - "v*"
  pull_request: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Install Dependencies
        run: go mod download

      - name: Tests
        run: go test -v ./...
